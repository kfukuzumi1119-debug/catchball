<script>
(() => {
if (!window.THREE) { document.getElementById('err').hidden = false; return; }
const V3 = THREE.Vector3;

// ---------- 画質 ----------
const coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
const Q = coarse ? { grass: 26000, shadow: 2048, pr: 1.5 } : { grass: 62000, shadow: 4096, pr: 2 };

let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' }); }
catch (e) { document.getElementById('err').hidden = false; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, Q.pr));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.5;
const stage = document.getElementById('stage');
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 900);
scene.fog = new THREE.FogExp2(0xcfe0ee, 0.0055);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = w < h ? 56 : 38;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ---------- 小道具 ----------
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20261006);
const rand = (a, b) => a + Math.random() * (b - a);
const rr = (a, b) => a + R() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (rate, dt) => 1 - Math.exp(-rate * dt);
const wrapAngle = a => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };
const col = h => new THREE.Color(h).convertSRGBToLinear();
const std = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: col(c), roughness: 0.85, metalness: 0 }, o));
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, y) => vnoise(x, y) * 0.55 + vnoise(x * 2.1, y * 2.1) * 0.3 + vnoise(x * 4.3, y * 4.3) * 0.15;
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.encoding = THREE.sRGBEncoding;
  return t;
}
const windU = { value: 0 };
// 風で揺らす（インスタンス後のワールド座標で位相を決める）
function addWind(mat, amp, heightPow) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.uTime = windU;
    sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <project_vertex>', `
      vec4 mvPosition = vec4( transformed, 1.0 );
      #ifdef USE_INSTANCING
        mvPosition = instanceMatrix * mvPosition;
      #endif
      float hh = pow(max(position.y, 0.0), ${heightPow.toFixed(1)});
      float ww = sin(uTime * 1.3 + mvPosition.x * 0.35 + mvPosition.z * 0.2) * 0.6 + sin(uTime * 2.9 + mvPosition.x * 0.8 - mvPosition.z * 0.5) * 0.25;
      mvPosition.x += ww * hh * ${amp.toFixed(3)};
      mvPosition.z += ww * hh * ${(amp * 0.5).toFixed(3)};
      mvPosition = modelViewMatrix * mvPosition;
      gl_Position = projectionMatrix * mvPosition;
    `);
  };
}

// ---------- 空 ----------
let sky = null, envSky = null, skyU = null;
const envScene = new THREE.Scene();
if (THREE.Sky) {
  sky = new THREE.Sky(); sky.scale.setScalar(500); scene.add(sky);
  skyU = sky.material.uniforms;
  envSky = new THREE.Sky(); envSky.material = sky.material; envSky.scale.setScalar(500); envScene.add(envSky);
} else {
  scene.background = col(0x9cc3e4);
}
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null;
function bakeEnv() {
  if (!envSky) return;
  const rt = pmrem.fromScene(envScene);
  if (envRT) envRT.dispose();
  envRT = rt; scene.environment = rt.texture;
}

const starGeo = new THREE.BufferGeometry();
{
  const p = [];
  for (let i = 0; i < 900; i++) {
    const th = R() * Math.PI * 2, y = 0.05 + R() * 0.95, r = Math.sqrt(1 - y * y);
    p.push(Math.cos(th) * r * 230, y * 230, Math.sin(th) * r * 230);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
}
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.5, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false, toneMapped: false });
scene.add(new THREE.Points(starGeo, starMat));

const glowTex = canvasTex(128, 128, (x, w) => {
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.2, 'rgba(255,255,255,0.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
});
const moonTex = canvasTex(128, 128, x => {
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,250,235,1)'); g.addColorStop(0.28, 'rgba(255,250,235,1)'); g.addColorStop(0.31, 'rgba(200,210,255,0.35)'); g.addColorStop(1, 'rgba(160,180,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
});
const moon = new THREE.Sprite(new THREE.SpriteMaterial({ map: moonTex, transparent: true, depthWrite: false, fog: false, toneMapped: false, opacity: 0 }));
moon.scale.setScalar(26); scene.add(moon);

const cloudTex = canvasTex(256, 128, x => {
  for (let i = 0; i < 46; i++) {
    const cx = rr(40, 216), cy = rr(50, 88) - Math.sin((cx - 40) / 176 * Math.PI) * 18, r = rr(12, 32);
    const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, 'rgba(255,255,255,0.42)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0, 0, 256, 128);
  }
});
const cloudMat = new THREE.SpriteMaterial({ map: cloudTex, transparent: true, depthWrite: false, fog: false, opacity: 0.9 });
const clouds = [];
for (let i = 0; i < 26; i++) {
  const s = new THREE.Sprite(cloudMat);
  const th = R() * Math.PI * 2, r = rr(70, 215);
  s.position.set(Math.cos(th) * r, rr(70, 125), Math.sin(th) * r);
  s.scale.set(rr(70, 140), rr(26, 44), 1);
  clouds.push(s); scene.add(s);
}

// ---------- 光 ----------
const hemi = new THREE.HemisphereLight(0xbfd9ef, 0x3a4a2a, 0.5);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.castShadow = true;
const sm = Math.min(Q.shadow, renderer.capabilities.maxTextureSize);
sun.shadow.mapSize.set(sm, sm);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 220 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

// ---------- 地面 ----------
const G_DARK = col(0x4a7334), G_BASE = col(0x6a9445), G_DRY = col(0xa0a95e), G_DIRT = col(0x8a7454);
const SPOTS = [[-9, 0], [9, 0]];
function wornAt(x, z) {
  let w = 0;
  for (const [sx, sz] of SPOTS) { const d = Math.hypot(x - sx, z - sz); w = Math.max(w, (1 - smooth(0.25, 1.4, d)) * 0.7 * (0.65 + 0.35 * vnoise(x * 3, z * 3))); }
  return w;
}
function groundColor(x, z, out) {
  const n = fbm(x * 0.045 + 10, z * 0.045 - 3);
  if (n < 0.5) out.copy(G_DARK).lerp(G_BASE, smooth(0.22, 0.5, n));
  else out.copy(G_BASE).lerp(G_DRY, smooth(0.55, 0.88, n) * 0.8);
  out.multiplyScalar(0.86 + 0.26 * fbm(x * 0.3 + 50, z * 0.3 + 20));
  const w = wornAt(x, z); if (w > 0) out.lerp(G_DIRT, w);
  return out;
}
const detailTex = canvasTex(256, 256, (x, w, h) => {
  x.fillStyle = 'rgb(226,230,220)'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 16000; i++) {
    const v = 150 + (Math.random() * 105 | 0);
    x.fillStyle = `rgba(${v - 10},${v},${v - 25},0.45)`;
    x.fillRect(Math.random() * w, Math.random() * h, 1, 1 + Math.random() * 2);
  }
});
detailTex.wrapS = detailTex.wrapT = THREE.RepeatWrapping;
detailTex.repeat.set(180, 180);
detailTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
{
  const geo = new THREE.PlaneGeometry(700, 700, 200, 200); geo.rotateX(-Math.PI / 2);
  const p = geo.attributes.position, c = new Float32Array(p.count * 3), tc = new THREE.Color();
  for (let i = 0; i < p.count; i++) { groundColor(p.getX(i), p.getZ(i), tc); c[i * 3] = tc.r; c[i * 3 + 1] = tc.g; c[i * 3 + 2] = tc.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(c, 3));
  const ground = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true, map: detailTex }));
  ground.receiveShadow = true;
  scene.add(ground);
}

// ---------- 芝 ----------
function clumpGeo() {
  const pos = [], colr = [], nor = [], idx = []; let v = 0;
  for (let b = 0; b < 5; b++) {
    const ox = (Math.random() - 0.5) * 0.17, oz = (Math.random() - 0.5) * 0.17;
    const h = rand(0.05, 0.13), w = rand(0.007, 0.013), th = Math.random() * Math.PI, bend = rand(-0.35, 0.35) * h;
    const cx = Math.cos(th), sz = Math.sin(th);
    for (const [t, o] of [[0, -w], [0, w], [0.55, -w * 0.6], [0.55, w * 0.6], [1, 0]]) {
      const bb = bend * t * t;
      pos.push(ox + cx * o - sz * bb, h * t, oz + sz * o + cx * bb);
      const g = 0.5 + 0.75 * t; colr.push(g, g, g); nor.push(0, 1, 0);
    }
    idx.push(v, v + 1, v + 2, v + 1, v + 3, v + 2, v + 2, v + 3, v + 4);
    idx.push(v, v + 2, v + 1, v + 1, v + 2, v + 3, v + 2, v + 4, v + 3); // 裏面も同じ法線で
    v += 5;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(colr, 3));
  g.setIndex(idx);
  return g;
}
{
  const RG = 27;
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true });
  addWind(mat, 2.6, 2);
  const per = Math.ceil(Q.grass / 3);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new V3(), p = new V3(), tc = new THREE.Color();
  for (let k = 0; k < 3; k++) {
    const im = new THREE.InstancedMesh(clumpGeo(), mat, per);
    for (let i = 0; i < per; i++) {
      const r = RG * Math.sqrt(Math.random()), a = Math.random() * Math.PI * 2;
      p.set(Math.cos(a) * r, 0, Math.sin(a) * r);
      const w = wornAt(p.x, p.z);
      const sc = rand(0.8, 1.35) * (1 - smooth(0.82 * RG, RG, r)) * clamp(1 - w * 1.4, 0.05, 1);
      q.setFromAxisAngle(THREE.Object3D.DefaultUp, Math.random() * Math.PI * 2);
      s.set(sc, sc * rand(0.85, 1.2), sc);
      im.setMatrixAt(i, m4.compose(p, q, s));
      groundColor(p.x, p.z, tc).multiplyScalar(rand(0.9, 1.15));
      im.setColorAt(i, tc);
    }
    im.receiveShadow = true;
    scene.add(im);
  }
}

// ---------- 木 ----------
const leafTex = canvasTex(512, 512, (x, w, h) => {
  x.clearRect(0, 0, w, h);
  x.strokeStyle = 'rgba(70,52,30,0.9)'; x.lineWidth = 2;
  for (let i = 0; i < 14; i++) { x.beginPath(); x.moveTo(rr(0, w), rr(0, h)); x.lineTo(rr(0, w), rr(0, h)); x.stroke(); }
  for (let i = 0; i < 950; i++) {
    const cx = rr(14, w - 14), cy = rr(14, h - 14);
    const d = Math.hypot((cx % 256) - 128, (cy % 256) - 128) / 128;
    if (R() < d * 0.75) continue;      // 各区画の中央ほど密に
    x.save(); x.translate(cx, cy); x.rotate(R() * Math.PI * 2);
    const l = 22 + R() * 18;
    x.fillStyle = `hsl(${rr(78, 112)}, ${rr(30, 55)}%, ${rr(16, 40)}%)`;
    x.beginPath(); x.ellipse(0, 0, l * 0.5, l * 0.22, 0, 0, Math.PI * 2); x.fill();
    x.restore();
  }
});

const C = { phase: 'hold', t: 0, thrower: blue, catcher: yellow, holdTime: 2.0, ft: 0, T: 1.2, tMul: 1, p0: new V3(), v0: new V3(), target: new V3(), side: new V3(), caStart: new V3(), willCatch: true, kind: 'catch', lastSide: new V3() };

function frame(ca, th) {

function plan() {

    C.side.copy(ca.home).addScaledVector(left, rand(-0.4, 0.4));
    const shoulder = C.side.clone().add(new V3(0, 1.4, 0)).addScaledVector(left, 0.185).addScaledVector(f, 0.08);
    const dir = f.clone().multiplyScalar(0.85).addScaledVector(UP, rand(-0.55, 0.65)).addScaledVector(left, rand(-0.75, 0.45)).normalize();
    C.target.copy(shoulder).addScaledVector(dir, 0.5);

}

  // p(t) = p0 + v t + g t^2 / 2 が T 秒後に target を通る
  C.v0.copy(C.target).sub(C.p0).addScaledVector(GRAV, -0.5 * C.T * C.T).divideScalar(C.T);

let lastBounce = 0;
function physics(dt) {
  if (!ball.free) return;
  const v = ball.vel, p = ball.pos;
  if (!ball.onGround) {
    v.addScaledVector(GRAV, dt);
    p.addScaledVector(v, dt);
    if (p.y < BALL_R) {
      p.y = BALL_R;
      const impact = -v.y;
      if (impact > 0.9) {
        v.y = impact * 0.4; v.x *= 0.7; v.z *= 0.7;
        if (performance.now() - lastBounce > 120) { playBounce(impact, p); lastBounce = performance.now(); }
      } else { v.y = 0; ball.onGround = true; }
    }
  } else {
    const f = Math.max(0, 1 - 1.5 * dt);   // 芝の抵抗
    v.x *= f; v.z *= f;
    p.addScaledVector(v, dt);
    const sp = Math.hypot(v.x, v.z);
    if (sp > 0.001) {
      _a.set(v.z, 0, -v.x).normalize();
      _q.setFromAxisAngle(_a, sp * dt / BALL_R);
      ball.mesh.quaternion.premultiply(_q);
    }
    if (sp < 0.04) v.set(0, 0, 0);

}

  const e = tod.e;

  hemi.groundColor.setRGB(0.03, 0.04, 0.03).lerp(tmpC2.setRGB(0.2, 0.22, 0.12), day);
  hemi.intensity = 0.55;
  tmpC.copy(F_DAY).lerp(F_GOLD, gold);
  scene.fog.color.copy(F_NIGHT).lerp(tmpC, day);

  yellow: { label: 'ボーダーのうしろ', get: (t, o) => { const p = yellow.root.position; o.pos.set(p.x + 3.0, 1.72, p.z - 0.95); o.look.set(blue.root.position.x, 1.15, blue.root.position.z * 0.5); } },

      _d.copy(ball.vel).setY(0).normalize();

const AUTO_ORDER = ['side', 'bench', 'blue', 'grass', 'far', 'yellow', 'top', 'ball'];
const cam = { mode: 'auto', autoIdx: 0, autoT: 0, free: { theta: 0.3, phi: 1.3, r: 16 } };

const camsEl = document.getElementById('cams');

const shotEl = document.getElementById('shot');
let shotTimer;
function flashShot(text) {

}

  if (k === 'auto') { cam.autoT = 0; flashShot(SHOTS[AUTO_ORDER[cam.autoIdx]].label); }

}
function initFree() {
  _a.copy(camera.position).sub(_b.set(0, 1.2, 0));

  cam.free.r = clamp(l, 3, 60);
  cam.free.theta = Math.atan2(_a.x, _a.z);

    shotOut.pos.set(Math.sin(f.theta) * Math.sin(f.phi), Math.cos(f.phi), Math.cos(f.theta) * Math.sin(f.phi)).multiplyScalar(f.r).add(_b.set(0, 1.2, 0));

const pointers = new Map();

  if (pointers.size === 2) { if (cam.mode !== 'free') setCam('free'); const [a, b] = [...pointers.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); r0 = cam.free.r; }

  const ctx = snd.ctx, now = ctx.currentTime;
  const s = ctx.createBufferSource(); s.buffer = snd.noise;
  const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = ctx.createGain(); g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(peak * vol, now + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, now + len);
  s.connect(f).connect(g).connect(snd.master); s.start(now, Math.random()); s.stop(now + len + 0.05);
}
function thump(freq, peak, len, vol) {
  const ctx = snd.ctx, now = ctx.currentTime;
  const o = ctx.createOscillator(); o.frequency.setValueAtTime(freq, now); o.frequency.exponentialRampToValueAtTime(freq * 0.5, now + len);
  const g = ctx.createGain(); g.gain.setValueAtTime(peak * vol, now); g.gain.exponentialRampToValueAtTime(0.0001, now + len);
  o.connect(g).connect(snd.master); o.start(now); o.stop(now + len + 0.05);
}
function playPop(p) { if (!snd.on) return; const v = volAt(p); noiseHit(1400, 0.9, 0.9, 0.07, v); thump(170, 0.55, 0.09, v); }
function playBounce(impact, p) { if (!snd.on) return; const v = volAt(p) * clamp(impact / 6, 0.15, 0.8); noiseHit(380, 1, 0.8, 0.06, v, 'lowpass'); thump(110, 0.4, 0.07, v); }
function playWhoosh() { if (!snd.on) return; noiseHit(900, 0.6, 0.12, 0.18, volAt(C.p0)); }
function chirp() {
  const ctx = snd.ctx, now = ctx.currentTime, n = 2 + (Math.random() * 3 | 0), base = rand(2800, 3800);
  const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  if (pan) { pan.pan.value = rand(-0.9, 0.9); pan.connect(snd.master); }
  for (let i = 0; i < n; i++) {
    const t0 = now + i * rand(0.09, 0.14);
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(base, t0); o.frequency.exponentialRampToValueAtTime(base * rand(1.25, 1.5), t0 + 0.06);
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.035, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.08);
    o.connect(g).connect(pan || snd.master); o.start(t0); o.stop(t0 + 0.1);
  }
}
function cricket() {
  const ctx = snd.ctx, now = ctx.currentTime;
  for (let i = 0; i < 3; i++) {
    const t0 = now + i * 0.06;
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = 4400;
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.012, t0 + 0.01); g.gain.linearRampToValueAtTime(0, t0 + 0.045);
    o.connect(g).connect(snd.master); o.start(t0); o.stop(t0 + 0.06);
  }
}
function ambient(dt, t) {
  if (!snd.on || !snd.ctx) return;
  snd.windGain.gain.setTargetAtTime(0.035 + 0.03 * Math.sin(t * 0.13) + 0.015 * Math.sin(t * 0.41), snd.ctx.currentTime, 1.5);
  if (tod.e > -2 && Math.random() < dt * 0.22) chirp();
  if (tod.e <= -2 && Math.random() < dt * 0.9) cricket();
}

// ---------- ボタン ----------
const TOD_LABEL = { auto: '自動', morning: '朝', day: '昼', dusk: '夕方', night: '夜' }, TOD_ORDER = ['auto', 'morning', 'day', 'dusk', 'night'];
const btnSky = document.getElementById('btnSky'), btnSlow = document.getElementById('btnSlow'), btnSound = document.getElementById('btnSound'), btnFull = document.getElementById('btnFull');
function autoName() { const a = autoTod(); return a.e < -3 ? '夜' : a.e < 10 ? (a.h > 12 ? '夕方' : '朝') : a.e < 28 && a.h < 12 ? '朝' : '昼'; }
function labelSky() { btnSky.textContent = '空：' + (tod.mode === 'auto' ? `自動（${autoName()}）` : TOD_LABEL[tod.mode]); }
btnSky.addEventListener('click', () => {
  tod.mode = TOD_ORDER[(TOD_ORDER.indexOf(tod.mode) + 1) % TOD_ORDER.length];
  labelSky(); try { localStorage.setItem('catchball.tod', tod.mode); } catch (e) {}
});
let timeScale = 1;
btnSlow.addEventListener('click', () => { timeScale = timeScale === 1 ? 0.55 : 1; btnSlow.setAttribute('aria-pressed', timeScale < 1 ? 'true' : 'false'); });
btnSound.addEventListener('click', () => {
  audioInit(); if (!snd.ctx) return;
  snd.on = !snd.on; snd.ctx.resume && snd.ctx.resume();
  snd.master.gain.setTargetAtTime(snd.on ? 0.8 : 0, snd.ctx.currentTime, 0.3);
  btnSound.setAttribute('aria-pressed', snd.on ? 'true' : 'false');
});
btnFull.addEventListener('click', () => {
  const el = document.documentElement;
  if (document.fullscreenElement) document.exitFullscreen && document.exitFullscreen().catch(() => {});
  else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
});

// 画面を消さない・UIを静かに隠す
let wakeLock = null, keepAwakeWanted = false;
function keepAwake() { if (wakeLock || !navigator.wakeLock) return; navigator.wakeLock.request('screen').then(l => { wakeLock = l; l.addEventListener('release', () => { wakeLock = null; }); }).catch(() => {}); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && wakeLock === null && keepAwakeWanted) keepAwake(); });
let idle = 0;
function wake() { idle = 0; document.body.classList.remove('calm'); }
['pointermove', 'pointerdown', 'keydown', 'touchstart'].forEach(n => window.addEventListener(n, () => { wake(); if (n !== 'pointermove') { keepAwakeWanted = true; keepAwake(); } }, { passive: true }));
const hint = document.getElementById('hint');
function hideHint() { hint.classList.add('gone'); }
setTimeout(hideHint, 6000);

try {
  const s = localStorage.getItem('catchball.tod'); if (s && TOD_ORDER.includes(s)) tod.mode = s;
  const c = localStorage.getItem('catchball.cam'); setCam(c && camButtons[c] && c !== 'free' ? c : 'auto');
} catch (e) { setCam('auto'); }
labelSky(); applyTod(0, true);

// ---------- ループ ----------
const clock = new THREE.Clock();
let simT = 0, skyCheck = 0, frames = 0, loadDone = false;
blue.update(0.016); yellow.update(0.016);
scene.updateMatrixWorld(true);
holdPoint(blue, 'hand', ball.pos);
function loop() {
  requestAnimationFrame(loop);
  const raw = Math.min(clock.getDelta(), 0.05);
  const dt = raw * timeScale;
  simT += dt;
  windU.value += raw;

  step(dt);
  scene.updateMatrixWorld();
  if (!ball.free) {
    ball.offset.multiplyScalar(Math.exp(-dt * 12));
    holdPoint(ball.holder, ball.where, ball.pos).add(ball.offset);
  } else if (C.phase === 'flight') {
    _a.set(ball.vel.z, 0, -ball.vel.x).normalize();
    _q.setFromAxisAngle(_a, -dt * 25); ball.mesh.quaternion.premultiply(_q);
  }
  ball.mesh.position.copy(ball.pos);
  blob.position.set(ball.pos.x, 0.012, ball.pos.z);
  blob.material.opacity = clamp(0.26 - ball.pos.y * 0.08, 0.0, 0.26);
  const bs = 1 + ball.pos.y * 0.3; blob.scale.set(bs, bs, bs);

  clouds.forEach(c => { c.position.x += raw * 0.6; if (c.position.x > 220) c.position.x = -220; });
  skyCheck += raw; if (skyCheck > 30) { skyCheck = 0; labelSky(); }
  applyTod(raw, false);
  updateCamera(raw, simT);
  ambient(raw, simT);

  idle += raw; if (idle > 5 && !document.body.classList.contains('calm')) document.body.classList.add('calm');
  renderer.render(scene, camera);
  if (++frames >= 3 && (modelsReady >= modelsWanted || simT > 20) && !loadDone) { loadDone = true; document.getElementById('loading').classList.add('done'); }
}
loop();
})();
</script>
</body>
